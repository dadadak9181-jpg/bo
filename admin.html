<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INSTORY 콘텐츠 관리</title><style>*{box-sizing:border-box}body{font-family:Pretendard,system-ui,sans-serif;color:#19354b;margin:0;background:#f5f7fa}main{max-width:980px;margin:50px auto;padding:0 20px}h1{font-size:28px}p{color:#678}form,.panel{background:white;border:1px solid #dde5ed;padding:25px;border-radius:12px;margin:20px 0}label{display:block;font-size:13px;font-weight:700;margin:14px 0 5px}input,select,textarea{width:100%;padding:12px;border:1px solid #ced9e3;border-radius:6px;font:inherit}textarea{min-height:220px;resize:vertical}button{border:0;border-radius:6px;background:#215a84;color:white;padding:12px 18px;font-weight:700;cursor:pointer}button:disabled{opacity:.6}.row{display:grid;grid-template-columns:1fr 1fr;gap:15px}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.muted{color:#748493;font-size:12px}#status{font-size:13px;white-space:pre-wrap}article{border-top:1px solid #e1e9ee;padding:15px 0;display:flex;justify-content:space-between;gap:16px}article button{font-size:12px;padding:6px 11px;background:#687d8b}@media(max-width:650px){.row{grid-template-columns:1fr}}</style></head><body><main><h1>INSTORY 콘텐츠 관리</h1><p>보험소식 · 재테크 · 시사 · 자료실 · 월별 소식지 등록</p><div class="panel"><label>Cloudflare API 주소<input id="api" type="url" value="https://instory-content-api.porom.workers.dev"></label><p class="muted">Cloudflare Worker 배포 후 주소를 입력합니다. 관리자 권한은 Cloudflare Access에서 인증해야 합니다.</p><a id="login" href="https://instory-content-api.porom.workers.dev/api/admin/posts" target="_blank" rel="noopener" style="display:inline-block;margin-right:12px;color:#215a84">① 관리자 로그인</a><button id="load" type="button">② 등록 글 조회</button></div><form id="form"><input id="id" type="hidden"><div class="row"><div><label>게시판<select id="category"><option value="magazines">월별 소식지</option><option value="insurance-news">오늘의 보험소식</option><option value="finance">오늘의 재테크상식</option><option value="current">오늘의 시사상식</option><option value="products">상품 자료실</option><option value="needs">상담 자료</option><option value="qa">질문과 답변</option><option value="resources">기타 자료실</option><option value="main-links">메인 모음 링크</option></select></label></div><div><label>공개 상태<select id="visibility"><option value="published">게시</option><option value="draft">임시저장</option></select></label></div></div><label>제목<input id="title" required maxlength="180"></label><div class="row"><div><label>보험사명<input id="insurer" maxlength="100"></label></div><div><label>발행연월<input id="month" type="month" value="2026-10"></label></div></div><label>본문 (HTML 가능)<textarea id="body" placeholder="본문을 작성하세요"></textarea></label><div class="row"><div><label>표지 이미지 (JPG / PNG / WebP)<input id="cover" type="file" accept=".jpg,.jpeg,.png,.webp"></label><small id="cover-key" class="muted"></small></div><div><label>첨부 PDF<input id="pdf" type="file" accept=".pdf,application/pdf"></label><small id="pdf-key" class="muted"></small></div></div><div class="actions" style="margin-top:24px"><button id="submit" type="submit">글 등록</button><button id="clear" type="button" style="background:#778997">새 글 작성</button><span id="status" role="status"></span></div></form><section class="panel"><h2>등록 글</h2><div id="list">API 연결 후 조회할 수 있습니다.</div></section></main><script>
const $=id=>document.getElementById(id);let current=[];
const base=()=>{const x=$('api').value.trim().replace(/\/$/,'');if(!/^https:\/\/[^/]+$/.test(x))throw Error('Cloudflare Worker HTTPS 주소를 입력하세요.');return x};
const call=async(path,opts={})=>{const r=await fetch(base()+path,{credentials:'include',...opts});let j;try{j=await r.json()}catch{throw Error('서버에 접근할 수 없습니다. 관리자 인증 또는 CORS 설정을 확인하세요.')}if(!r.ok)throw Error(j.error||'요청 실패');return j};
function msg(t){$('status').textContent=t}
async function upload(file){if(!file)return null;const fd=new FormData();fd.append('file',file);const r=await call('/api/admin/files',{method:'POST',body:fd});return r.key}
function clear(){ $('form').reset();$('id').value='';$('cover-key').textContent='';$('pdf-key').textContent='';$('submit').textContent='글 등록';msg('')}
$('clear').onclick=clear;
$('load').onclick=load;
async function load(){try{const out=await call('/api/admin/posts?limit=50');current=out.items||[];const el=$('list');el.replaceChildren();if(!current.length){el.textContent='등록된 글이 없습니다.';return}for(const p of current){const a=document.createElement('article');const info=document.createElement('span');info.textContent=p.title+' · '+p.category+' · '+(p.issue_month||'');const acts=document.createElement('span');const edit=document.createElement('button');edit.textContent='수정';edit.onclick=async()=>{try{const x=await call('/api/admin/posts/'+encodeURIComponent(p.id));$('id').value=x.id;$('category').value=x.category;$('title').value=x.title;$('body').value=x.content_html;$('insurer').value=x.insurer;$('month').value=x.issue_month?x.issue_month.replace('.','-'):'';$('visibility').value=x.status;$('cover-key').textContent=x.cover_key||'';$('pdf-key').textContent=x.pdf_key||'';$('submit').textContent='수정 저장';window.scrollTo({top:0,behavior:'smooth'})}catch(e){alert(e.message)}};const del=document.createElement('button');del.textContent='삭제';del.style.background='#a84e4e';del.onclick=async()=>{if(!confirm('선택한 게시글을 삭제할까요?'))return;try{await call('/api/admin/posts/'+encodeURIComponent(p.id),{method:'DELETE'});await load()}catch(e){alert(e.message)}};acts.append(edit,document.createTextNode(' '),del);a.append(info,acts);el.append(a)}}catch(e){msg(e.message)}}
$('form').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;msg('저장 중...');try{const imageKey=await upload($('cover').files[0])||$('cover-key').textContent||null;const pdfKey=await upload($('pdf').files[0])||$('pdf-key').textContent||null;const m=$('month').value;const data={category:$('category').value,status:$('visibility').value,title:$('title').value.trim(),insurer:$('insurer').value.trim(),issue_month:m?m.replace('-','.'):null,content_html:$('body').value,cover_key:imageKey,pdf_key:pdfKey};const id=$('id').value;await call('/api/admin/posts'+(id?'/'+encodeURIComponent(id):''),{method:id?'PUT':'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)});clear();await load();msg('DB에 저장되었습니다.')}catch(e){msg('저장 실패: '+e.message)}finally{$('submit').disabled=false}};
</script></body></html>
