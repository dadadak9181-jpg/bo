<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INSTORY 관리자 로그인</title><link rel="stylesheet" href="/assets/admin-manager.css"><style>body{display:grid;place-items:center;min-height:100vh;margin:0;background:#f5f5f5}.login-shell{width:min(410px,calc(100% - 36px));background:white;border:1px solid #e5e5e5;padding:42px;border-radius:6px}.login-shell h1{font-size:23px;margin:0 0 10px}.login-shell p{font-size:13px;color:#777;margin:0 0 28px}.login-shell label{display:block;margin:15px 0;color:#555}.login-shell input{display:block;width:100%;padding:13px;margin-top:7px;border:1px solid #ddd}.login-shell button{width:100%;margin-top:18px;background:#293548;color:#fff;padding:13px;border:0;cursor:pointer}.login-shell #error{color:#b24f4f;margin-top:14px}</style></head><body><main class="login-shell"><h1>INSTORY 관리자 로그인</h1><p>콘텐츠를 등록하고 관리할 수 있습니다.</p><form id="login"><label>아이디<input name="username" autocomplete="username" required></label><label>비밀번호<input name="password" type="password" autocomplete="current-password" required></label><button>로그인</button></form><p id="error" role="alert"></p></main><script>document.getElementById('login').addEventListener('submit',async function(e){e.preventDefault();const form=e.target,btn=form.querySelector('button'),out=document.getElementById('error');btn.disabled=true;out.textContent='';try{const r=await fetch('/admin/api/login',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});if(!r.ok){out.textContent=r.status===401?'아이디 또는 비밀번호를 확인하세요.':'로그인 오류 ('+r.status+')';return}location.replace('/admin/insurance-news')}catch(err){out.textContent='연결 오류: '+err.message}finally{btn.disabled=false}})</script></body></html>
