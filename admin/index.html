<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INSTORY 콘텐츠 관리</title><link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css"><link rel="stylesheet" href="/assets/admin-manager.css"></head><body><main><h1>INSTORY 콘텐츠 관리</h1><p class="admin-status">게시판을 선택한 뒤 글을 등록하거나 기존 글을 관리하세요. <span style="margin-left:8px;color:#999;font-size:11px">에디터 v2.1</span></p><div class="admin-layout"><aside class="admin-sidebar"><div class="admin-sidebar-title">INSTORY <small>MASTER ADMIN</small></div><a class="admin-dashboard-link" href="/admin"><span aria-hidden="true">▦</span> 대시보드</a><div class="admin-menu-heading">콘텐츠 관리</div><nav id="board-nav" class="admin-board-nav" aria-label="관리할 게시판"></nav><div class="admin-menu-heading master-group-heading">마스터 관리</div><nav class="admin-board-nav master-nav" aria-label="마스터 관리 기능"><a href="/admin/master/insurers"><span aria-hidden="true">◫</span> 보험사 정보</a><a href="/admin/master/bookmarks"><span aria-hidden="true">⌁</span> 보험 북마크</a><a href="/admin/master/site"><span aria-hidden="true">▧</span> 사이트 구성</a><a href="/admin/master/system"><span aria-hidden="true">⚙</span> 운영 및 권한</a></nav><div class="admin-sidebar-bottom"><a href="https://www.seoul-ga.com/" target="_blank" rel="noopener">사이트 보기 ↗</a></div></aside><div class="admin-workspace"><section id="master-dashboard" class="master-dashboard" hidden></section><div class="panel" id="api-panel"><label>Cloudflare API 주소<input id="api" type="url" value="https://instory-content-api.porom.workers.dev"></label><p class="muted">Cloudflare Worker 배포 후 주소를 입력합니다. 외부 사이트에서 등록이 실패한다면 Worker의 /admin 주소로 접속해 주세요. 관리자는 Cloudflare Access 인증이 필요합니다.</p><a id="login" href="/manager" target="_blank" rel="noopener" style="display:inline-block;margin-right:12px;color:#215a84">① 관리자 로그인</a><button id="load" type="button">② 등록 글 조회</button></div><form id="form"><input id="id" type="hidden"><div class="row"><div><label>게시판<select id="category"><option value="magazines">월별 소식지</option><option value="insurance-news">오늘의 보험소식</option><option value="finance">오늘의 재테크상식</option><option value="current">오늘의 시사상식</option><option value="products">상품 자료실</option><option value="needs">상담 자료</option><option value="qa">질문과 답변</option><option value="resources">기타 자료실</option><option value="main-links">메인 모음 링크</option></select></label></div><div><label>공개 상태<select id="visibility"><option value="published">게시</option><option value="draft">임시저장</option></select></label></div></div><div id="module-fields" hidden><div class="row"><div><label>업무 메뉴<select id="module-type"><option value="0">보험전산 링크</option><option value="1">고객센터/팩스번호</option><option value="2">청구 이메일/URL</option><option value="3">청구한도금액</option><option value="4">청구 우편주소</option><option value="5">청구서 모아보기</option><option value="6">보험사별 수납일</option><option value="7">카드정보</option></select></label></div><div><label>보험사 / 기관명<input id="module-insurer" maxlength="100" placeholder="예: 삼성화재"></label></div></div><div class="row"><div><label>전산·업무 구분<input id="module-kind" maxlength="100" placeholder="GA전산, 전용전산, Android, iOS 등"></label></div><div><label>연결 URL<input id="module-link" type="url" placeholder="https://"></label></div></div><label>표에 표시할 내용<textarea id="module-description" style="min-height:92px" placeholder="팩스번호, 청구 한도, 수납일, 카드 납입 정보 등을 입력하세요"></textarea></label></div><div id="standard-fields"><div id="qa-fields" hidden><label>질문 분류<select id="qa-kind"><option value="보험대리점_GA정보">보험대리점_GA정보</option><option value="파이코트_보안관사업단">파이코트_보안관사업단</option><option value="보험찬애쉿">보험찬애쉿</option><option value="기타">기타</option></select></label></div><label><span id="title-label">제목</span><input id="title" required maxlength="180"></label><p id="form-hint" class="form-hint"></p><div class="row mag-only" id="mag-only"><div><label>보험사명<input id="insurer" maxlength="100"></label></div><div><label>발행연월<input id="month" type="month" value="2026-10"></label></div></div><div id="extra-fields" class="row" hidden><div id="url-field" hidden><label>연결 주소 (https://)<input id="reference-url" type="url" placeholder="https://"></label></div><div id="source-field" hidden><label id="source-label">출처 / 기관<input id="reference-source" maxlength="100" placeholder="선택 입력"></label></div></div><label id="body-label">본문</label><div id="rich-editor" aria-label="본문 TOAST UI 편집기"></div><input id="body" type="hidden"><div class="row" id="file-fields"><div id="image-field"><label id="image-label">대표 이미지 (JPG / PNG / WebP)<input id="cover" type="file" accept=".jpg,.jpeg,.png,.webp"></label><small id="cover-key" class="muted"></small></div><div id="pdf-field"><label id="pdf-label">첨부 PDF<input id="pdf" type="file" accept=".pdf,application/pdf"></label><small id="pdf-key" class="muted"></small></div></div></div><div class="actions" style="margin-top:24px"><button id="submit" type="submit">등록</button><button id="clear" type="button" hidden>새 글 작성</button><span id="status" role="status"></span></div></form><section class="panel"><h2>등록 글</h2><div id="list">API 연결 후 조회할 수 있습니다.</div></section></div></div></main><script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script><script src="https://uicdn.toast.com/editor/latest/i18n/ko-kr.min.js"></script><script src="/assets/admin-manager.js" defer></script></body></html>
