const home=()=>'<section class="hero"><div class="shell hero-inner"><div><div class="eyebrow">INSURANCE WORK, BETTER ORGANIZED</div><h1>보험 정보의 깊이는 더하고,<br>업무의 복잡함은 덜어내다.</h1><p>상품정보부터 상담 자료, 보험사 바로가기까지.<br>보험 전문가의 하루를 위한 정보 플랫폼, BO.</p></div><div><form id="search" class="hero-search"><input name="q" aria-label="통합 검색" placeholder="상품명, 자료명, 키워드를 검색하세요" required><button type="submit">검색 ↗</button></form><div class="search-hint">필요한 자료를 더 빠르게 찾으세요.</div></div></div></section><main class="shell content"><section class="section"><div class="section-heading"><div><h2>업무 바로가기</h2><p class="section-desc">가장 자주 찾는 업무 정보를 한눈에.</p></div></div><div class="routes">'+[['products','상품정보','보험 상품 및 자료'],['needs','보험니즈자료','상담과 제안을 위한 자료'],['bookmark','보험북마크','보험사 및 관련 기관 바로가기']].map(x=>'<a class="route" href="#/'+x[0]+'"><span><strong>'+x[1]+'</strong><small>'+x[2]+'</small></span><span class="arrow">↗</span></a>').join('')+'</div></section>'+bookmark()+'<div class="twocol">'+section('products')+section('needs')+'</div><div class="feature-band"><div><div class="over">BO INFORMATION ARCHIVE</div><h3>보험 실무에 필요한 정보를, 한곳에서.</h3></div><a href="#/bookmark">보험사 바로가기 ↗</a></div><section class="section"><div class="section-heading"><div><h2>오늘의 정보</h2><p class="section-desc">보험·재테크·시사 정보를 주제별로 살펴보세요.</p></div></div><div class="news-tabs">'+[['insurance-news','오늘의 보험소식'],['finance','오늘의 재테크상식'],['current','오늘의 시사상식']].map((x,i)=>'<button data-news="'+x[0]+'" class="'+(i===0?'active':'')+'">'+x[1]+'</button>').join('')+'</div><div id="news-content" class="article-list">'+list('insurance-news',3)+'</div></section></main>';
const page=(key)=>'<div class="page-head"><div class="shell"><div class="crumb">HOME / '+esc(sections[key].title)+'</div><h1>'+esc(sections[key].title)+'</h1><p>'+esc(sections[key].desc)+'</p></div></div><main class="shell content">'+(key==='bookmark'?bookmark():'<div class="listing-tools"><span class="count" id="count"></span><input id="filter" placeholder="게시물 검색" aria-label="게시물 검색"></div><div id="results" class="article-list"></div>')+'</main>';
const detail=id=>{let p=posts.find(x=>x.id===Number(id));if(!p)return notfound();return '<div class="page-head"><div class="shell"><div class="crumb">HOME / '+esc(sections[p.cat].title)+' / 상세보기</div><h1>'+esc(sections[p.cat].title)+'</h1></div></div><main class="shell content"><article class="detail"><h2>'+esc(p.title)+'</h2><div class="detail-meta">'+esc(p.tag)+' · '+esc(p.date)+'</div><div class="detail-body">'+esc(p.body)+'</div><a class="back" href="#/'+p.cat+'">← 목록으로</a></article></main>'};
const notfound=()=>'<main class="shell content"><h2>페이지를 찾을 수 없습니다.</h2><a href="#/">홈으로 돌아가기 →</a></main>';
const app=document.getElementById('app');
function render(){let path=decodeURIComponent(location.hash.slice(2)||'').split('?')[0],q=new URLSearchParams((location.hash.split('?')[1]||''));if(!path)app.innerHTML=home();else if(path==='search'){app.innerHTML='<div class="page-head"><div class="shell"><div class="crumb">HOME / SEARCH</div><h1>통합 검색</h1><p>등록된 콘텐츠에서 검색합니다.</p></div></div><main class="shell content"><div class="listing-tools"><span class="count" id="count"></span><input id="filter" aria-label="검색어" placeholder="검색어를 입력하세요"></div><div id="results" class="article-list"></div></main>';let input=document.getElementById('filter');input.value=q.get('q')||'';setupList(null)}else if(path.startsWith('post/'))app.innerHTML=detail(path.split('/')[1]);else if(sections[path]){app.innerHTML=page(path);if(path!=='bookmark')setupList(path)}else app.innerHTML=notfound();document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#/'+path));document.getElementById('nav').classList.remove('open');document.getElementById('menu').setAttribute('aria-expanded','false');window.scrollTo(0,0)}
function setupList(cat){const inp=document.getElementById('filter'),out=document.getElementById('results'),count=document.getElementById('count');function update(){let q=inp.value.trim().toLowerCase(),items=posts.filter(p=>(!cat||p.cat===cat)&&(p.title+' '+p.body+' '+p.tag).toLowerCase().includes(q));count.textContent='총 '+items.length+'건';out.innerHTML=items.length?items.map(p=>'<a class="article" href="#/post/'+p.id+'"><span><b>'+esc(sections[p.cat].title)+'</b>'+esc(p.title)+'</span><time>'+esc(p.date)+'</time></a>').join(''):'<p class="empty">검색 결과가 없습니다.</p>'}inp.addEventListener('input',update);update()}
document.addEventListener('click',e=>{let b=e.target.closest('[data-group]');if(b){document.querySelectorAll('[data-group]').forEach(x=>x.classList.toggle('active',x===b));document.getElementById('logo-content').innerHTML=logoGrid(b.dataset.group)}let n=e.target.closest('[data-news]');if(n){document.querySelectorAll('[data-news]').forEach(x=>x.classList.toggle('active',x===n));document.getElementById('news-content').innerHTML=list(n.dataset.news,3)}});
document.addEventListener('submit',e=>{if(e.target.id==='search'){e.preventDefault();location.hash='#/search?q='+encodeURIComponent(new FormData(e.target).get('q'))}});
document.getElementById('menu').addEventListener('click',()=>{let nav=document.getElementById('nav'),open=nav.classList.toggle('open');document.getElementById('menu').setAttribute('aria-expanded',String(open))});
window.addEventListener('hashchange',render);render();
</script></body></html>
