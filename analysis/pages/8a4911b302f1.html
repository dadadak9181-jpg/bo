<!DOCTYPE html><html lang="ko"><head>
    <meta charset="UTF-8">
    <title>비밀번호 찾기</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f3f4f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .find-box { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .find-box h2 { text-align: center; color: #002b5e; margin-bottom: 20px; border-bottom: 2px solid #002b5e; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 6px; color: #444; font-size: 14px; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        .btn-submit { width: 100%; padding: 12px; background-color: #002b5e; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px; transition: 0.2s; }
        .btn-submit:hover { background-color: #001f44; }
        .msg { padding: 12px; margin-bottom: 15px; border-radius: 4px; text-align: center; font-size: 14px; font-weight: bold; line-height: 1.5; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .success { background-color: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        .links { text-align: center; margin-top: 20px; font-size: 13px; }
        .links a { color: #666; text-decoration: none; padding: 0 10px; }
        .links a:hover { color: #002b5e; font-weight: bold; }
    </style>
</head>
<body>
<div class="find-box">
    <h2>비밀번호 찾기</h2>
    <p style="font-size:13px; color:#666; text-align:center; margin-bottom:20px;">가입하신 이메일로 임시 비밀번호를 발송해 드립니다.</p>
    
    
            <form method="POST" action="">
            <div class="form-group">
                <label>아이디</label>
                <input type="text" name="user_id" placeholder="가입 시 등록한 아이디" required="" autofocus="">
            </div>
            <div class="form-group">
                <label>이름</label>
                <input type="text" name="user_name" placeholder="가입 시 등록한 이름" required="">
            </div>
            <div class="form-group">
                <label>이메일</label>
                <input type="email" name="email" placeholder="가입 시 인증한 이메일" required="">
            </div>
            <button type="submit" class="btn-submit">임시 비밀번호 발송</button>
        </form>
